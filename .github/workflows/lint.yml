name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo rhysd/actionlint --pattern '*_linux_amd64.tar.gz'
          tar xf actionlint_*_linux_amd64.tar.gz actionlint

      - name: actionlint
        run: ./actionlint -color